[package]
name = "xray-bridge"
version = "0.1.0"
edition = "2021"
description = "HTTP→gRPC bridge for Xray node management API"

[[bin]]
name = "xray-bridge"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.12", default-features = false, features = ["transport", "prost", "tls", "tls-roots", "tls-webpki-roots", "codegen"] }
prost = "0.13"
prost-types = "0.13"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "matched-path", "query", "tracing"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
lru = "0.12"
parking_lot = "0.12"
http = "1"
bytes = "1"
async-trait = "0.1"

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3
