name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 release 必需

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu       # 通用 Linux x86_64 (动态链接 glibc)
          - target: x86_64-unknown-linux-musl      # 静态链接, Alpine / 容器友好
          - target: aarch64-unknown-linux-gnu      # ARM64 服务器 (动态)
          - target: aarch64-unknown-linux-musl     # ARM64 静态

    steps:
      - uses: actions/checkout@v4

      # 注意: 不需要安装 protoc — build.rs 用 protoc-bin-vendored 自带二进制.
      # 这对 cross-compile 至关重要 (cross 在 Docker 容器里跑, 找不到 host 装的 protoc).

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build & upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: xray-bridge
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
